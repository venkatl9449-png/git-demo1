name: Hello world
on: 
  push:
    branches: 
      - main
      - develop
      - 'release/**'
  pull_request: 
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build step
        run: echo "a build demo"
  test:
     runs-on: ubuntu-latest
     needs: build
     steps:
       - name: Test step
         run: echo "running test"
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
       - name: deploy the app
         run: echo "deploy test job"
